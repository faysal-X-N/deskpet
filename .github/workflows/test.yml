name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 显式声明 packages：该 action 默认安装 tools platform-tools，
      # 而 legacy tools 包已被 Google 从 SDK 仓库移除，新 runner 上必然报
      # "Failed to find package 'tools'" 而失败。platform/build-tools 由
      # Gradle 在构建时自动补装（licenses 已被 action 接受）。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 本仓库 wrapper 指向阿里云镜像（国内下载快），CI 上换回官方地址。
      # 直接整行替换 distributionUrl，镜像地址怎么变都不会失效。
      - name: Use official Gradle distribution
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Decode signing keystore (if configured)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deskpet.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/deskpet.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 未配置，发布将使用未签名/debug APK"
          fi

      - name: Build release APK (R8)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload debug APK (always)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (always)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release*.apk

      - name: Pick APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/deskpet-release.apk"
          else
            echo "::warning::无正式签名 release APK，回退为 debug 签名 APK 发布"
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/deskpet-release.apk"
          fi

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/deskpet-release.apk
          generate_release_notes: true
