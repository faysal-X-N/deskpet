name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Use official Gradle distribution (GitHub Actions 在美国)
        run: |
          sed -i 's|mirrors\.aliyun\.com/github/releases/gradle/gradle-distributions/v8\.13\.0/gradle-8\.13-bin\.zip|services.gradle.org/distributions/gradle-8.13-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest
